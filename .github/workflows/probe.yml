name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          for d in cbcsettlementfunding.com settlementdecisions.com nerdwallet.com; do echo "R site $(curl -s -m 60 -X POST -H 'content-type: application/json' -d "{\"domain\":\"$d\"}" 'https://www.scairos.com/api/getcited/v1/site?view=card' | grep -o '"you":{[^}]*}')"; done
          echo "R mcp $(curl -s -m 60 -X POST -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"getcited_site","arguments":{"domain":"cbcsettlementfunding.com"}}}' https://getcited.scairos.com/mcp | grep -o 'Open Authority[^|]*' | head -1)"
