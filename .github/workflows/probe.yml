name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "DNS $(dig +short getcited.scairos.com | tr '\n' ' ')"
          for u in https://getcited.scairos.com/mcp https://www.scairos.com/api/getcited/mcp https://www.scairos.com/mcp; do
            echo "POST $u -> $(curl -s -o /dev/null -w '%{http_code}' -m 20 -X POST -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"t","version":"1"}}}' $u)"
          done
