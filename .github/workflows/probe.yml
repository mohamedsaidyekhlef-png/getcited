name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          B='{"question":"What is a structured settlement?","mine":"https://www.annuity.org/structured-settlements/","competitors":["https://www.investopedia.com/terms/s/structured-settlement.asp","https://en.wikipedia.org/wiki/Structured_settlement"]}'
          curl -s -m 110 -X POST -H 'content-type: application/json' -d "$B" 'https://www.scairos.com/api/getcited/v1/takeover?view=card' > t.json
          echo "R takeover $(head -c 200 t.json)"
          node -e 'const r=require("./t.json");console.log("R summary",JSON.stringify({err:r.error,before:r.before&&{rank:r.before.rank,share:r.before.share,leader:r.before.leader},after:r.after&&{rank:r.after.rank,share:r.after.share,won:r.after.won},tried:r.tried,shape:r.winner&&r.winner.shape,passage:r.winner&&r.winner.passage.slice(0,500),answer:r.after&&r.after.answer.sentences.map(s=>s.source+": "+s.text.slice(0,90)),auth:r.offsite&&r.offsite.authority,template:r.template}))'
          echo "R mcp $(curl -s -m 30 -X POST -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' https://getcited.scairos.com/mcp | grep -o 'getcited_[a-z]*' | sort -u | tr '\n' ' ')"
          echo "R page $(curl -s https://www.scairos.com/getcited | grep -o 'Take over one AI answer' | head -1)"
