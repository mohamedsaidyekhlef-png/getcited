name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          echo "R vitals $(curl -s -m 90 -X POST -H 'content-type: application/json' -d '{"url":"https://cbcsettlementfunding.com"}' 'https://www.scairos.com/api/getcited/v1/vitals?view=card' | head -c 900)"
          echo "R vitals2 $(curl -s -m 90 -X POST -H 'content-type: application/json' -d '{"url":"https://www.nerdwallet.com"}' 'https://www.scairos.com/api/getcited/v1/vitals?view=card' | head -c 700)"
          echo "R site $(curl -s -m 60 -X POST -H 'content-type: application/json' -d '{"domain":"cbcsettlementfunding.com"}' 'https://www.scairos.com/api/getcited/v1/site?view=card' | head -c 500)"
          echo "R audit $(curl -s -m 60 -X POST -H 'content-type: application/json' -d '{"url":"https://cbcsettlementfunding.com"}' 'https://www.scairos.com/api/getcited/v1/audit?view=card' | head -c 300)"
